# ══════════════════════════════════════════════════════════════════════════════
# Baustein:    c2-customer-edc – Skalierungskonfiguration K1-NAS (Überlagerung)
# Basis:       values.yaml in diesem Ordner; hier nur Abweichungen (CPU, RAM gleich).
# Zweck:       Engpasshypothese prüfen (F3): EDC Control Plane des Customers und
#              PostgreSQL der EDCs entlasten (Entscheidung LABORBUCH.md,
#              2026-10-07, „Ressourcenanalyse“; Werte 2026-10-08, „K1 vorbereitet“).
#              Die zusätzliche CPU stammt aus kaum genutzten Zuteilungen, damit die
#              Summe der requests in `Allocatable` (7000m) passt.
# Messwerte:   CPU in Kernen bei 1,0/s ohne Kippen (K0 rep-1) / höchstens in K0
#              (gekippt, rep-2 bis rep-4), runs/…/prometheus/cpu_cores.csv.
#
# Anwenden [Mac] (vorher PURIS und EDC anhalten, siehe AUFBAU.md, „K1-NAS“):
#   helm upgrade --install edc tractusx-dev/dataspace-connector-bundle --version 1.3.0 -n customer \
#     -f ".../setup/c2-customer-edc/values.yaml" -f ".../setup/c2-customer-edc/k1-nas.yaml"
# Zurück zu K0: derselbe Befehl ohne `-f …/k1-nas.yaml`.
# ══════════════════════════════════════════════════════════════════════════════

tractusx-connector:
  controlplane:
    # 500m → 1000m. K0: 0,13 / 0,50 – im gekippten Zustand am Limit, 100 % der
    # Perioden gedrosselt. Die JVM sieht weiterhin 1 CPU (SerialGC wie in K0).
    resources:
      requests: { cpu: 1000m, memory: 1Gi }
      limits:   { cpu: 1000m, memory: 1Gi }
  dataplane:
    # 200m → 100m (Spender). K0: 0,003 / 0,025. Start dauert länger (K0 mit 200m:
    # 73 s; erwartet ca. 150 s) – Lebendprüfung ab 300 s (values.yaml) genügt.
    resources:
      requests: { cpu: 100m, memory: 768Mi }
      limits:   { cpu: 100m, memory: 768Mi }

postgresql:
  primary:
    # 200m → 400m. K0: 0,09 / 0,20 – im gekippten Zustand am Limit, 100 % gedrosselt.
    resources:
      requests: { cpu: 400m, memory: 512Mi }
      limits:   { cpu: 400m, memory: 512Mi }
