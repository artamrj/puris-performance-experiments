# ══════════════════════════════════════════════════════════════════════════════
# Baustein:    c4-supplier-edc – Skalierungskonfiguration K1-NAS (Überlagerung)
# Basis:       values.yaml in diesem Ordner; hier nur Abweichungen (CPU, RAM gleich).
# Zweck:       wie c2-customer-edc/k1-nas.yaml (F3): PostgreSQL des Supplier-EDC
#              entlasten; Data Plane und Vault des Suppliers geben CPU ab.
# Messwerte:   CPU in Kernen bei 1,0/s ohne Kippen (K0 rep-1) / höchstens in K0.
#
# Anwenden [Mac] (vorher PURIS und EDC anhalten, siehe AUFBAU.md, „K1-NAS“):
#   helm upgrade --install edc tractusx-dev/dataspace-connector-bundle --version 1.3.0 -n supplier \
#     -f ".../setup/c4-supplier-edc/values.yaml" -f ".../setup/c4-supplier-edc/k1-nas.yaml"
# Zurück zu K0: derselbe Befehl ohne `-f …/k1-nas.yaml`.
# ══════════════════════════════════════════════════════════════════════════════

tractusx-connector:
  dataplane:
    # 400m → 250m (Spender). K0: 0,042 / 0,091; linear hochgerechnet bei 3/s ca.
    # 0,13. Start mit 400m: 33 s (erwartet ca. 55 s; Lebendprüfung ab 180 s).
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits:   { cpu: 250m, memory: 1Gi }

postgresql:
  primary:
    # 200m → 400m. K0: 0,10 / 0,20 – im gekippten Zustand am Limit, 100 % gedrosselt.
    resources:
      requests: { cpu: 400m, memory: 512Mi }
      limits:   { cpu: 400m, memory: 512Mi }

vault:
  server:
    # 100m → 50m (Spender). K0: 0,015 / 0,021. Die Vault des Customers bleibt bei
    # 100m (in K0 im gekippten Zustand am Limit – möglicher nächster Engpass).
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 50m, memory: 128Mi }
