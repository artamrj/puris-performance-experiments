# ══════════════════════════════════════════════════════════════════════════════
# Baustein:    d2-puris-supplier – Skalierungskonfiguration K1-NAS (Überlagerung)
# Basis:       values.yaml in diesem Ordner; hier nur Abweichungen (CPU, RAM gleich).
# Zweck:       Spender für K1-NAS (siehe c2-customer-edc/k1-nas.yaml, F3).
# Messwerte:   CPU in Kernen bei 1,0/s ohne Kippen (K0 rep-1) / höchstens in K0.
#
# Anwenden [Mac] (vorher PURIS und EDC anhalten, siehe AUFBAU.md, „K1-NAS“):
#   helm upgrade --install puris "$HOME/.local/opt/puris-loadlab/charts/puris-7.2.0/charts/puris" -n supplier \
#     -f ".../setup/d2-puris-supplier/values.yaml" -f ".../setup/d2-puris-supplier/k1-nas.yaml"
# Zurück zu K0: derselbe Befehl ohne `-f …/k1-nas.yaml`.
# ══════════════════════════════════════════════════════════════════════════════

backend:
  # 400m → 250m (Spender). K0: 0,007 / 0,048. Nicht 200m: Start mit 400m dauerte
  # 209 s, mit 200m wären ca. 7 min nahe am Zeitlimit von `lab` (10 min).
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits:   { cpu: 250m, memory: 1536Mi }
