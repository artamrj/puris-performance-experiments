# ══════════════════════════════════════════════════════════════════════════════
# Baustein:    c3-customer-dtr
# Chart:       digital-twin-bundle 1.3.0 (https://eclipse-tractusx.github.io/charts/dev)
#              mit Sub-Charts digital-twin-registry 0.11.0 und postgresql 15.2.1
#              (Bitnami)
# Komponenten: Digital Twin Registry 0.11.0 (tractusx/sldt-digital-twin-registry:0.11.0);
#              PostgreSQL 15.4.0 (bitnamilegacy/postgresql:15.4.0-debian-11-r45)
#              (Versionen = Standard dieser Chart-Version)
# Zweck:       DTR des Customers (BPNL00000003AZQP): Verzeichnis seiner
#              digitalen Zwillinge. Bei der Bestandsabfrage (Customer fragt den
#              Supplier) nicht gefragt; vorhanden wie in der PURIS-Referenz
#              (`dtr-customer`, PURIS 6.2.0 `local/docker-compose.yaml`; Deployment
#              View: DTR je Partner). Das Umbrella-Chart 26.03.00 hat für den
#              Customer keinen DTR.
# Regeln:      KONZEPT.md, Abschnitt 3. Nur bewusste Abweichungen vom Chart-
#              Standard. Jeder Container: requests = limits (QoS Guaranteed).
#              CPU nach dem NAS-Profil (VPS-VARIANTE.md, Abschnitt 2); RAM
#              abweichend (siehe unten). Nach dem Probelauf abgleichen.
#
# Ausnahme Zugangsdaten: Der Chart übernimmt das Datenbank-Passwort aus dieser
#              Datei in sein Secret; ein vorhandenes Secret kann nicht angegeben
#              werden. Es bleiben die öffentlich bekannten Testwerte des Bundles
#              (wie im Umbrella-Chart für den DTR des Suppliers; nur im Cluster
#              erreichbar, nur Testdaten; Entscheidung 2026-10-06, LABORBUCH.md).
#
# Installation [Mac] (im Terminal vorher `puris`):
#   helm upgrade --install dtr tractusx-dev/digital-twin-bundle --version 1.3.0 \
#     -n customer \
#     -f "$HOME/Downloads/2 Bachelorarbeit/6-experiment/setup/c3-customer-dtr/values.yaml"
# ══════════════════════════════════════════════════════════════════════════════


# ═══ Digital Twin Registry ════════════════════════════════════════════════════
digital-twin-registry:
  # Kurzer Name statt `<Release>-digital-twin-registry` (Standard): Dienst
  # `dtr.customer`, Port 8080 (beim Supplier `dtr.supplier`).
  fullnameOverride: dtr

  registry:
    # Anmeldung bleibt aus (Standard des Bundles; PURIS: `dtr.idp.enabled: false`).
    # Kein Ingress (Standard des Sub-Charts: an, mit TLS).
    ingress:
      enabled: false

    # Datenbank des Bundles (Release `dtr` → Dienst `dtr-postgresql`). Der
    # Standard des Bundles enthält den Platzhalter `<release-name>`.
    # Benutzer und Passwort: Testwerte des Bundles (Ausnahme, siehe Kopf).
    dataSource:
      url: "jdbc:postgresql://dtr-postgresql:5432/dtr"

    # CPU nach dem NAS-Profil (im Ablauf nicht gefragt). RAM 1Gi statt 512Mi
    # (NAS-Profil): Der Chart erlaubt keine Java-Einstellung (keine
    # zusätzlichen Umgebungsvariablen), die JVM nimmt 25 % des Limits als Heap
    # – mit 1Gi rund 256 MiB. 1Gi ist zugleich der Standard des Charts.
    # (Standard des Charts: requests 250m/1024Mi, limits 750m/1024Mi.)
    resources:
      requests: { cpu: 100m, memory: 1Gi }
      limits:   { cpu: 100m, memory: 1Gi }

    # Mit 0,1 Kernen startet der Java-Dienst sehr langsam. Lebendprüfung erst
    # nach 600 s (Standard: 100 s, Neustart nach 3 × 3 s), damit der Container
    # beim Start nicht in eine Neustart-Schleife gerät. Startdauer wird bei der
    # Installation gemessen.
    livenessProbe:
      initialDelaySeconds: 600


# ═══ PostgreSQL (Datenbank des DTR) ═══════════════════════════════════════════
# Dauerhaftes Volume ist Standard des Bundles (10Gi, StorageClass des Clusters
# = local-path) und bleibt so.
postgresql:
  primary:
    # CPU nach dem NAS-Profil; RAM 256Mi statt 128Mi (NAS-Profil): PostgreSQL
    # reserviert standardmäßig 128 MB gemeinsamen Speicher (shared_buffers).
    # (Standard: resourcesPreset „nano“, requests ≠ limits.)
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits:   { cpu: 50m, memory: 256Mi }
